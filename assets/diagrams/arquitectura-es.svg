<svg xmlns="http://www.w3.org/2000/svg" width="500" height="742" viewBox="0 0 500 742" role="img" aria-labelledby="title desc">
<title id="title">Del sensor al reporte</title>
<desc id="desc">Nueve nodos LoRaWAN → Gateway A → TTN → MQTT → Node-RED. Node-RED alimenta FlowFuse, genera reportes PDF y escribe en InfluxDB. Grafana consulta las series y RStudio accede a los datos almacenados.</desc>
