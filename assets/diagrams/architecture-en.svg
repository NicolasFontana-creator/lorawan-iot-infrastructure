<svg xmlns="http://www.w3.org/2000/svg" width="500" height="742" viewBox="0 0 500 742" role="img" aria-labelledby="title desc">
<title id="title">From sensor to report</title>
<desc id="desc">Nine LoRaWAN nodes → Gateway A → TTN → MQTT → Node-RED. Node-RED updates FlowFuse, generates PDF reports and writes to InfluxDB. Grafana queries the time series and RStudio accesses stored data.</desc>
