<marker id="live" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="10" refX="7" refY="5" orient="auto-start-reverse"><path d="M0 0L8 5L0 10Z" fill="#6bdcd0"/></marker>
<marker id="ref" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="10" refX="7" refY="5" orient="auto-start-reverse"><path d="M0 0L8 5L0 10Z" fill="#f1bd75"/></marker>
